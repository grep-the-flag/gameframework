name: ci

on:
  pull_request:
  push:
    branches: [develop]
  # Manual/redeploy fallback: run CI + publish for develop again, e.g. after a
  # release/* branch is deleted (dispatched by redeploy-on-release-delete.yml).
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: gameframework
          POSTGRES_PASSWORD: gameframework
          POSTGRES_DB: gameframework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameframework"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The postgres image's bootstrap role (POSTGRES_USER, here not the
      # default "postgres" name) is created as the instance superuser, so it
      # has CREATEDB — required because tests/db's fixture creates and drops
      # scratch databases of its own for the migration-chain tests. Same name
      # (GF_DATABASE_URL) as .env.example and compose.yaml, so the repo has
      # one variable rather than a per-context alias.
      GF_DATABASE_URL: postgresql+psycopg://gameframework:gameframework@localhost:5432/gameframework
      # frontend_origin has no default (M2 Task 2): a misconfigured install
      # must fail at startup rather than silently trust a documentation
      # domain. CI supplies its own test value the same way it supplies
      # GF_DATABASE_URL above.
      GF_FRONTEND_ORIGIN: https://app.event.example.com
      # data_dir has no default either (M2 Task 3, ADR-0007): the framework
      # draws the session-signing key into a file there, and that file is
      # the one thing conftest.py's `from gameframework.main import app`
      # needs to succeed at collection — every test in this job, not just
      # auth, would otherwise fail before running. CI has no persistence
      # requirement to weigh (the runner is thrown away after the job), so
      # any writable path is equally correct; this is a throwaway value,
      # not an operator choice the way the volume in compose.yaml is.
      GF_DATA_DIR: /tmp/gameframework-data
      # cookie_domain has no default either (M2 Task 3 Step 4, ADR-0007,
      # api-surface.md §2.2): the session cookie's `Domain=` attribute is
      # derived from it. Bare domain, no leading dot — the app supplies
      # the dot itself.
      GF_COOKIE_DOMAIN: event.example.com
      # player_tcp_host/event_domain have no default either (M2 Task 13):
      # the run preflight resolves <label>.event_domain into an instance
      # hostname and hashes both into its config hash, and neither has a
      # plausible-looking wrong value to fall back on.
      GF_PLAYER_TCP_HOST: event.example.com
      GF_EVENT_DOMAIN: event.example.com
      # tcp_port_range has no default either, though for a different reason
      # than the settings above: a range too small makes the preflight
      # refuse loudly rather than fail silently. It is required because an
      # operator who never chose one has opened no firewall rule for it.
      GF_TCP_PORT_RANGE: 20000-29999
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pyright

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # Stabilisation lock (git-workflow.md): while any release/* branch exists,
  # develop must not be published to staging.
  release-lock:
    runs-on: ubuntu-latest
    outputs:
      locked: ${{ steps.check.outputs.locked }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate \
            --jq '[.[].name | select(startswith("release/"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice::publish skipped — $count open release/* branch(es) hold the stabilisation lock"
          else
            echo "locked=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c   # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: ${{ matrix.component }}
          target: prod
          push: false

  publish:
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.release-lock.outputs.locked == 'false'
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, backend-typecheck, frontend-lint, frontend-test, frontend-typecheck, release-lock]
    # One publish at a time, in order; never cancel a half-finished
    # sign/attest sequence (deployment concurrency lock, git-workflow.md).
    concurrency:
      group: publish-develop-${{ matrix.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c   # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build locally first: the Trivy gate (ADR-0016) runs BEFORE anything is pushed.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: ${{ matrix.component }}
          target: prod
          load: true
          tags: local/gameframework-${{ matrix.component }}:scan
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: local/gameframework-${{ matrix.component }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: ${{ matrix.component }}
          target: prod
          push: true
          tags: |
            ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}:develop
            ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}:sha-${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2
      - name: Sign image (keyless, OIDC)
        run: cosign sign --yes ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610   # v0.24.0
        with:
          image: ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
      - name: Attest SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.component }}.spdx.json
          push-to-registry: true
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/grep-the-flag/gameframework/' \
            ghcr.io/grep-the-flag/gameframework-${{ matrix.component }}@${{ steps.build.outputs.digest }}
