vulnerabilities:
  - id: CVE-2026-14456
    statement: >
      Time-boxed suppression, not a risk acceptance without evidence. Three
      findings, each backed by a command run against the built frontend prod
      image (local/gameframework-frontend:scan, nginx-unprivileged:alpine base
      at digest sha256:901e944d1f4fc2bd077e8f5568b98c1f6f8cdacf6b97a87747c43134a339b9a7):

      1. Built: `nginx -V` reports `--with-http_v3_module` in its configure
      arguments, so the QUIC-serving code this CVE lives in is compiled into
      the shipped binary.

      2. Not activated: every `listen` directive under the shipped
      /etc/nginx/ is `listen 8080;` in /etc/nginx/conf.d/default.conf — plain
      TCP, HTTP/1.1. No `listen ... quic` or `listen ... http3` directive
      exists anywhere in the image's nginx configuration.

      3. Not reachable: the image's only published port is 8080/tcp
      (Dockerfile `EXPOSE 8080`; `docker inspect` reports
      Config.ExposedPorts == {"8080/tcp":{}}) — no UDP port is published at
      all, and QUIC is a UDP-transported protocol, so no client can reach the
      QUIC code path even if it were activated. Per ADR-0008 and
      git-workflow.md, this container also sits behind the deployment's
      Traefik reverse proxy on the internal network; Traefik is the sole
      component terminating public TLS and routing for the core and
      minigame subdomains, and this container never receives a direct
      public connection of any kind.

      As no sibling nginx-unprivileged tag (alpine, alpine-slim, 1.29-alpine,
      1.29-alpine-slim, 1.29.3-alpine, latest, stable, stable-alpine) has
      picked up libssl3/libcrypto3 3.5.8-r0 yet, this suppression holds until
      one does or until it expires, whichever comes first.
    expired_at: 2026-09-26
