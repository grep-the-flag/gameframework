[project]
name = "gameframework-backend"
version = "0.1.0"
description = "Gameframework core backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.115",
    "gameframework-sdk",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameframework"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) exempts immutable-typed
# parameters automatically, which is why `key: str | None =
# Depends(idempotency_key)` (Task 2) never tripped it — `str` is
# immutable. FastAPI's own DI pattern always calls `Depends(...)` in a
# default, and Task 3 is the first place it lands on a non-immutable
# type (Session, Settings, AuthContext) — the canonical fix upstream
# ruff/FastAPI docs give for exactly this.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "gameframework.api.deps.current_session",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# src stays strict; tests relax the unknown-type rules because Starlette's
# TestClient is only partially typed — strict would fail on its unknowns,
# not on our code.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false },
]

[tool.pytest.ini_options]
addopts = "--cov=gameframework --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/gameframework"]

[tool.uv.sources]
gameframework-sdk = { git = "https://github.com/grep-the-flag/gameframework-sdk.git", rev = "v0.0.2" }
