services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameframework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameframework}
      POSTGRES_DB: ${POSTGRES_DB:-gameframework}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameframework}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: backend
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-gameframework}:${POSTGRES_PASSWORD:-gameframework}@db:5432/${POSTGRES_DB:-gameframework}}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  dbdata:
