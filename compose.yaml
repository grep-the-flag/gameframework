services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameframework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameframework}
      POSTGRES_DB: ${POSTGRES_DB:-gameframework}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameframework}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: backend
      target: dev
    environment:
      GF_DATABASE_URL: ${GF_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-gameframework}:${POSTGRES_PASSWORD:-gameframework}@db:5432/${POSTGRES_DB:-gameframework}}
    command: sh -c "uv run alembic upgrade head && uv run uvicorn gameframework.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  dbdata:
